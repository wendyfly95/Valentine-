<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 🖤</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.7);
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(8px);
            max-width: 85%;
            width: 320px;
        }

        #gif-container img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 1.6rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            height: 60px; 
            position: relative;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #333;
            color: white;
        }

        #noBtn {
            background-color: #fff;
            color: #333;
            border: 1px solid #ccc;
        }

        .hidden { display: none; }

        @keyframes walk {
            0% { transform: translateY(0) opacity(1); }
            100% { transform: translateY(-80vh) opacity(0); }
        }
        .paw {
            position: fixed;
            font-size: 2rem;
            animation: walk 3s linear forwards;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body onclick="playMusic()">

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
    </audio>

    <div id="askPage" class="container">
        <div id="gif-container">
            <img src="https://media.giphy.com/media/qUIm5BCLbzoTvRg523/giphy.gif" alt="Begging Black Cat">
        </div>
        <h1>2026 情人節...<br>可以把你借給我嗎？🥺</h1>
        <div class="buttons">
            <button id="yesBtn">好呀 喵！🐱</button>
            <button id="noBtn">不要...😿</button>
        </div>
    </div>

    <div id="successPage" class="container hidden">
        <div id="gif-container">
            <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Black Cat">
        </div>
        <h1>我就知道你會答應！<br>最愛你了！🖤</h1>
        <p>Music is playing for us...🎵</p>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const askPage = document.getElementById('askPage');
        const successPage = document.getElementById('successPage');
        const bgMusic = document.getElementById('bgMusic');
        let musicStarted = false;

        function playMusic() {
            if (!musicStarted) {
                bgMusic.volume = 0.4;
                bgMusic.play().catch(e => console.log("Music Waiting"));
                musicStarted = true;
            }
        }

        yesBtn.addEventListener('click', () => {
            playMusic();
            askPage.classList.add('hidden');
            successPage.classList.remove('hidden');
            startPaws();
        });

        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveButton(); });
        noBtn.addEventListener('mouseover', moveButton);

        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.max(10, x)}px`;
            noBtn.style.top = `${Math.max(10, y)}px`;
        }

        function startPaws() {
            setInterval(() => {
                const paw = document.createElement('div');
                paw.innerHTML = '🐾';
                paw.className = 'paw';
                paw.style.left = Math.random() * 90 + 'vw';
                paw.style.top = '100vh';
                document.body.appendChild(paw);
                setTimeout(() => paw.remove(), 3000);
            }, 300);
        }
    </script>
</body>
</html>
