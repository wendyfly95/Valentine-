<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💗</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e8, #ffeaf4);
    font-family: Arial, Helvetica, sans-serif;
  }

  .card {
    background: white;
    padding: 24px;
    border-radius: 20px;
    text-align: center;
    width: 90%;
    max-width: 360px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  h1 {
    color: #ff4f9a;
    font-size: 1.8rem;
    margin-bottom: 16px;
  }

  img {
    width: 100%;
    max-width: 240px;
    border-radius: 16px;
    margin-bottom: 20px;
  }

  .btn-area {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 10px;
  }

  button {
    padding: 12px 20px;
    font-size: 1rem;
    border: none;
    border-radius: 30px;
    cursor: pointer;
  }

  #yesBtn {
    background-color: #ff4f9a;
    color: white;
  }

  #noBtn {
    background-color: #ffd1e6;
    color: #555;
    position: relative;
  }

  .music {
    margin-top: 14px;
    font-size: 0.85rem;
    color: #777;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Will you be my Valentine? 💗</h1>

  <!-- 這張圖我測過 GitHub Pages 會顯示 -->
  <img src="https://images.unsplash.com/photo-1595433707802-5f0c6b0d8f93?w=500"
       alt="cute kitten with watery eyes">

  <div class="btn-area">
    <button id="yesBtn">YES 💕</button>
    <button id="noBtn">NO 🙈</button>
  </div>

  <div class="music" onclick="toggleMusic()">🎵 Toggle music</div>
</div>

<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/audio/2022/08/02/audio_3cfa8f2c53.mp3" type="audio/mpeg">
</audio>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const bgm = document.getElementById("bgm");

  noBtn.addEventListener("mouseenter", () => {
    const x = Math.random() * 80 - 40;
    const y = Math.random() * 40 - 20;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
      <div style="
        min-height:100vh;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ffd6e8,#ffeaf4);
        text-align:center;
        font-family:Arial;
      ">
        <h1 style="color:#ff4f9a;">YAY!!! 💖</h1>
        <p style="font-size:1.4rem;">You just made my heart melt 🥺</p>
        <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=500"
             style="width:240px;border-radius:18px;">
      </div>
    `;
    bgm.play();
  });

  function toggleMusic() {
    bgm.paused ? bgm.play() : bgm.pause();
  }
</script>

</body>
</html>
